
serenity.browser.maximized = true
serenity.console.colors = true

serenity {
    console.colors = true
    logging = VERBOSE
    console.headings = NORMAL
    reports.show.step.details = true
    restart.browser.for.each = scenario
take.screenshots = FOR_FAILURES
}

